<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewmaster's Bazaar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Crimson Text', Georgia, serif; color: #f0e6d0; }
    #game-canvas { width: 100vw; height: 100vh; display: block; position: fixed; top: 0; left: 0; z-index: 0; }

    /* ═══ INTRO OVERLAY ═══ */
    #intro-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(26,26,46,0.85) 0%, rgba(10,10,20,0.95) 100%);
    }
    #intro-overlay h1 {
      font-family: 'MedievalSharp', cursive; font-size: 3rem; color: #d4a44c;
      text-shadow: 0 2px 8px rgba(212,164,76,0.4); margin-bottom: 0.5rem;
    }
    #intro-overlay .subtitle { color: #a08c6a; font-style: italic; margin-bottom: 2rem; font-size: 1.1rem; }
    #intro-overlay .prompt { color: #c8b896; font-size: 1.2rem; margin-bottom: 0.8rem; }
    #intro-overlay input {
      background: rgba(44,32,18,0.8); border: 2px solid #6b4c2a; border-radius: 6px;
      color: #f0e6d0; font-family: 'Crimson Text', serif; font-size: 1.3rem;
      padding: 0.6rem 1.2rem; text-align: center; outline: none; width: 280px;
    }
    #intro-overlay input:focus { border-color: #d4a44c; box-shadow: 0 0 12px rgba(212,164,76,0.3); }
    #intro-overlay .hint { color: #7a6b52; font-size: 0.85rem; margin-top: 0.5rem; }

    /* ═══ HUD ═══ */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: none; padding: 10px 20px;
      background: linear-gradient(180deg, rgba(20,15,8,0.9) 0%, rgba(20,15,8,0) 100%);
    }
    #hud-inner { display: flex; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto; }
    .hud-section { display: flex; align-items: center; gap: 12px; }
    #cart-name-display { font-family: 'MedievalSharp', cursive; font-size: 1.3rem; color: #d4a44c; }
    #crown-display { font-size: 1.2rem; color: #f0d060; font-weight: 600; }
    #streak-display { font-size: 1rem; color: #ff6b35; display: none; }
    #reputation-display { font-size: 1rem; color: #88cc88; }
    .hud-btn {
      background: rgba(44,32,18,0.8); border: 1px solid #6b4c2a; border-radius: 4px;
      color: #c8b896; padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 0.9rem;
    }
    .hud-btn:hover { border-color: #d4a44c; color: #d4a44c; }

    /* ═══ GAME UI PANELS ═══ */
    .panel {
      position: fixed; z-index: 40;
      background: rgba(30,22,12,0.92); border: 2px solid #4a3520;
      border-radius: 8px; padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* SHELF PANEL — left side */
    #shelf-panel {
      left: 12px; top: 60px; bottom: 12px; width: 200px;
      display: none; overflow-y: auto;
    }
    #shelf-panel h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 8px; font-size: 1.1rem; }
    .shelf-tier-label { color: #8a7a60; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }
    .ingredient-btn {
      display: flex; align-items: center; gap: 6px; width: 100%;
      background: rgba(60,45,25,0.6); border: 1px solid #3a2a18; border-radius: 4px;
      color: #d8c8a8; padding: 6px 8px; margin-bottom: 3px; cursor: pointer;
      font-family: inherit; font-size: 0.9rem; text-align: left; transition: all 0.15s;
    }
    .ingredient-btn:hover { border-color: #d4a44c; background: rgba(80,60,30,0.6); }
    .ingredient-btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .ingredient-btn .cost { margin-left: auto; color: #f0d060; font-size: 0.8rem; }

    /* CAULDRON PANEL — bottom center */
    #cauldron-panel {
      bottom: 12px; left: 50%; transform: translateX(-50%); width: 440px;
      display: none;
    }
    #cauldron-panel h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 8px; text-align: center; }
    
    .base-selector { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .base-btn {
      background: rgba(60,45,25,0.6); border: 2px solid #3a2a18; border-radius: 6px;
      color: #c8b896; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
      transition: all 0.15s;
    }
    .base-btn:hover { border-color: #8a7040; }
    .base-btn.selected { border-color: #d4a44c; background: rgba(100,80,40,0.6); color: #f0e6d0; }

    .ingredient-slots { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
    .ingredient-slot {
      width: 80px; height: 50px; border: 2px dashed #4a3520; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; color: #6a5a40; background: rgba(40,30,15,0.5);
      cursor: pointer; position: relative;
    }
    .ingredient-slot.filled { border-style: solid; border-color: #6b4c2a; color: #d8c8a8; background: rgba(60,45,25,0.7); }
    .ingredient-slot .remove-btn {
      position: absolute; top: -6px; right: -6px; width: 16px; height: 16px;
      background: #8b3a3a; border: none; border-radius: 50%; color: #fff;
      font-size: 10px; cursor: pointer; display: none; line-height: 16px; text-align: center;
    }
    .ingredient-slot.filled .remove-btn { display: block; }

    .method-selector { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .method-btn {
      background: rgba(60,45,25,0.6); border: 2px solid #3a2a18; border-radius: 6px;
      color: #c8b896; padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 0.9rem;
      transition: all 0.15s;
    }
    .method-btn:hover { border-color: #8a7040; }
    .method-btn.selected { border-color: #d4a44c; background: rgba(100,80,40,0.6); color: #f0e6d0; }

    #brew-btn {
      display: block; margin: 0 auto; padding: 10px 40px;
      background: linear-gradient(180deg, #8b5e2a 0%, #6b3a1f 100%);
      border: 2px solid #d4a44c; border-radius: 8px;
      color: #f0e6d0; font-family: 'MedievalSharp', cursive; font-size: 1.3rem;
      cursor: pointer; transition: all 0.2s; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    #brew-btn:hover { background: linear-gradient(180deg, #a0702f 0%, #804520 100%); transform: scale(1.05); }
    #brew-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #brew-cost { text-align: center; color: #f0d060; font-size: 0.85rem; margin-bottom: 6px; }

    /* CUSTOMER PANEL — right side */
    #customer-panel {
      right: 12px; top: 60px; width: 220px;
      display: none;
    }
    #customer-panel h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 8px; }
    .customer-card {
      background: rgba(50,38,20,0.8); border: 1px solid #4a3520; border-radius: 6px;
      padding: 10px; margin-bottom: 8px; position: relative;
    }
    .customer-card .emoji { font-size: 1.5rem; }
    .customer-card .name { font-weight: 600; color: #d8c8a8; }
    .customer-card .speech {
      font-style: italic; color: #a8987a; font-size: 0.85rem; margin-top: 4px;
      border-left: 2px solid #4a3520; padding-left: 8px;
    }
    .customer-card .patience-bar {
      height: 3px; background: #3a5a3a; border-radius: 2px; margin-top: 6px; overflow: hidden;
    }
    .customer-card .patience-fill { height: 100%; background: #88cc66; transition: width 1s linear; }
    .serve-btn {
      display: block; width: 100%; margin-top: 6px; padding: 5px;
      background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; border-radius: 4px;
      color: #a8d888; cursor: pointer; font-family: inherit; font-size: 0.85rem;
    }
    .serve-btn:hover { background: rgba(70,100,50,0.6); border-color: #6a9a4a; }
    .serve-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* RESULT OVERLAY */
    #result-overlay {
      position: fixed; inset: 0; z-index: 80; display: none;
      background: rgba(10,8,4,0.7);
      align-items: center; justify-content: center;
    }
    #result-card {
      background: rgba(40,30,15,0.95); border: 3px solid #d4a44c; border-radius: 12px;
      padding: 30px 40px; text-align: center; max-width: 400px;
      box-shadow: 0 0 40px rgba(212,164,76,0.3);
    }
    #result-card h2 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 4px; }
    #result-card .stars { font-size: 1.3rem; margin-bottom: 8px; }
    #result-card .lore { font-style: italic; color: #a8987a; margin-bottom: 8px; font-size: 0.95rem; }
    #result-card .near-miss { color: #e8a030; font-weight: 600; margin-bottom: 8px; }
    #result-card .discovery { color: #88dd66; font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    #result-dismiss {
      margin-top: 12px; padding: 8px 30px;
      background: rgba(60,45,25,0.8); border: 1px solid #6b4c2a; border-radius: 6px;
      color: #d8c8a8; cursor: pointer; font-family: inherit; font-size: 1rem;
    }

    /* JOURNAL OVERLAY */
    #journal-overlay {
      position: fixed; inset: 0; z-index: 90; display: none;
      background: rgba(10,8,4,0.85);
      align-items: center; justify-content: center;
    }
    #journal-book {
      background: rgba(35,28,15,0.98); border: 3px solid #6b4c2a; border-radius: 12px;
      padding: 24px 30px; width: 600px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    #journal-book h2 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 16px; text-align: center; }
    .journal-recipe {
      background: rgba(50,38,20,0.6); border: 1px solid #3a2a18; border-radius: 6px;
      padding: 10px 14px; margin-bottom: 8px;
    }
    .journal-recipe.undiscovered { opacity: 0.5; filter: blur(1px); }
    .journal-recipe .recipe-name { font-weight: 600; color: #d8c8a8; }
    .journal-recipe .recipe-stars { color: #f0d060; }
    .journal-recipe .recipe-lore { font-style: italic; color: #8a7a60; font-size: 0.85rem; margin-top: 2px; }
    .journal-recipe .recipe-details { color: #a08c6a; font-size: 0.85rem; margin-top: 4px; }
    #journal-close {
      display: block; margin: 16px auto 0; padding: 8px 30px;
      background: rgba(60,45,25,0.8); border: 1px solid #6b4c2a; border-radius: 6px;
      color: #d8c8a8; cursor: pointer; font-family: inherit; font-size: 1rem;
    }

    /* NOTIFICATIONS */
    #notifications {
      position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 70;
      display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
    }
    .notification {
      background: rgba(30,22,12,0.95); border: 1px solid #6b4c2a; border-radius: 6px;
      padding: 8px 20px; color: #f0e6d0; font-size: 0.95rem;
      animation: notifSlide 0.3s ease-out;
      white-space: nowrap;
    }
    .notification.gold { border-color: #d4a44c; color: #f0d060; }
    .notification.discovery { border-color: #88dd66; color: #88dd66; }
    .notification.streak { border-color: #ff6b35; color: #ff6b35; }
    @keyframes notifSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* BREWING ANIMATION OVERLAY */
    #brewing-overlay {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; pointer-events: none;
    }
    #brewing-text {
      font-family: 'MedievalSharp', cursive; font-size: 1.5rem; color: #d4a44c;
      text-shadow: 0 0 20px rgba(212,164,76,0.6);
      animation: brewPulse 1s ease-in-out infinite;
    }
    @keyframes brewPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

    /* SERVE FEEDBACK */
    .serve-feedback {
      position: fixed; z-index: 75; font-size: 1.5rem;
      animation: serveFeedback 1.5s ease-out forwards; pointer-events: none;
    }
    @keyframes serveFeedback {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }

    /* ═══ MERCHANT PANEL ═══ */
    #merchant-panel {
      position: fixed; z-index: 80; display: none;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 420px; max-height: 80vh; overflow-y: auto;
      background: rgba(30,22,12,0.96); border: 3px solid #d4a44c;
      border-radius: 12px; padding: 20px;
      box-shadow: 0 0 40px rgba(212,164,76,0.3);
    }
    #merchant-panel h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 8px; text-align: center; }
    .merchant-dialogue { font-style: italic; color: #a8987a; font-size: 0.9rem; margin-bottom: 10px; padding: 8px; background: rgba(50,38,20,0.6); border-radius: 6px; border-left: 3px solid #6b4c2a; }
    .merchant-rotation-dialogue { font-style: italic; color: #c8a870; font-size: 0.85rem; margin-bottom: 8px; }
    .merchant-theme { color: #d4a44c; font-size: 0.85rem; text-align: center; margin-bottom: 4px; }
    .merchant-timer { color: #7a6b52; font-size: 0.8rem; text-align: center; margin-bottom: 12px; }
    .merchant-empty { color: #6a5a40; font-style: italic; text-align: center; padding: 20px; }
    .merchant-stock { display: flex; flex-direction: column; gap: 6px; }
    .merchant-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(50,38,20,0.6); border: 1px solid #3a2a18; border-radius: 6px; }
    .merchant-item-name { color: #d8c8a8; font-size: 0.9rem; }
    .merchant-item-details { color: #7a6b52; font-size: 0.75rem; display: block; }
    .merchant-item-price { color: #f0d060; font-weight: 600; margin-right: 8px; }
    .merchant-item-actions { display: flex; align-items: center; }
    .merchant-buy-btn { background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; border-radius: 4px; color: #a8d888; padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .merchant-buy-btn:hover { background: rgba(70,100,50,0.6); }
    .merchant-buy-btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .merchant-close-btn, .garden-close-btn, .barrel-close-btn, .equipment-close-btn {
      display: block; margin: 12px auto 0; padding: 8px 24px;
      background: rgba(60,45,25,0.8); border: 1px solid #6b4c2a; border-radius: 6px;
      color: #d8c8a8; cursor: pointer; font-family: inherit; font-size: 1rem;
    }

    /* ═══ GARDEN PANEL ═══ */
    #garden-panel {
      position: fixed; z-index: 45; display: none;
      left: 12px; top: 60px; bottom: 12px; width: 220px;
      background: rgba(30,22,12,0.92); border: 2px solid #4a3520;
      border-radius: 8px; padding: 12px; overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #garden-panel h3 { font-family: 'MedievalSharp', cursive; color: #88cc66; margin-bottom: 8px; }
    .garden-section-label { color: #8a7a60; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }
    .garden-plot { padding: 8px; background: rgba(50,58,30,0.6); border: 1px solid #3a4a20; border-radius: 6px; margin-bottom: 4px; }
    .garden-plot.ready { border-color: #6a9a4a; }
    .garden-plant-name { color: #d8c8a8; font-size: 0.9rem; display: block; }
    .garden-harvests { color: #7a6b52; font-size: 0.75rem; }
    .garden-harvest-btn { display: block; width: 100%; margin-top: 4px; padding: 4px; background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; border-radius: 4px; color: #a8d888; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .garden-harvest-btn:hover { background: rgba(70,100,50,0.6); }
    .garden-progress-bar { height: 4px; background: #2a3a1a; border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .garden-progress-fill { height: 100%; background: linear-gradient(90deg, #4a6a2a, #88cc44); transition: width 1s linear; }
    .garden-timer { color: #7a8a5a; font-size: 0.75rem; }
    .garden-empty { color: #6a5a40; font-style: italic; padding: 12px; }

    /* ═══ BARREL PANEL ═══ */
    #barrel-panel {
      position: fixed; z-index: 80; display: none;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 380px; max-height: 70vh; overflow-y: auto;
      background: rgba(30,22,12,0.96); border: 3px solid #8B5E3C;
      border-radius: 12px; padding: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    #barrel-panel h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 8px; text-align: center; }
    .barrel-empty { color: #6a5a40; font-style: italic; text-align: center; padding: 12px; }
    .barrel-item { padding: 10px; background: rgba(50,38,20,0.6); border: 1px solid #3a2a18; border-radius: 6px; margin-bottom: 6px; }
    .barrel-item.done { border-color: #d4a44c; }
    .barrel-drink-name { color: #d8c8a8; font-size: 0.9rem; }
    .barrel-collect-btn { display: block; width: 100%; margin-top: 6px; padding: 6px; background: linear-gradient(180deg, #6a5a2a, #4a3a1a); border: 1px solid #d4a44c; border-radius: 4px; color: #f0d060; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
    .barrel-collect-btn:hover { background: linear-gradient(180deg, #8a7a3a, #5a4a2a); }
    .barrel-progress-bar { height: 6px; background: #2a2a1a; border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .barrel-progress-fill { height: 100%; background: linear-gradient(90deg, #5A3A22, #d4a44c); transition: width 1s linear; }
    .barrel-timer { color: #8a7a60; font-size: 0.8rem; }
    .barrel-add-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #3a2a18; }
    .barrel-add-label { color: #8a7a60; font-size: 0.85rem; margin-bottom: 6px; }
    .barrel-add-btn { display: block; width: 100%; margin-bottom: 4px; padding: 6px; background: rgba(60,45,25,0.6); border: 1px solid #4a3520; border-radius: 4px; color: #d8c8a8; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .barrel-add-btn:hover { border-color: #8a7040; }

    /* ═══ EQUIPMENT PANEL ═══ */
    #equipment-panel {
      position: fixed; z-index: 80; display: none;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 440px; max-height: 80vh; overflow-y: auto;
      background: rgba(30,22,12,0.96); border: 3px solid #6b4c2a;
      border-radius: 12px; padding: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    #equipment-panel h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 12px; text-align: center; }
    .cart-level-section { background: rgba(50,38,20,0.6); border: 1px solid #3a2a18; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .cart-level-name { font-family: 'MedievalSharp', cursive; color: #d4a44c; font-size: 1.2rem; }
    .cart-level-stats { display: flex; gap: 12px; color: #a08c6a; font-size: 0.85rem; margin-top: 4px; }
    .cart-next-level { margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a2a18; }
    .cart-next-label { color: #c8b896; font-weight: 600; }
    .cart-next-reqs { display: flex; gap: 10px; margin-top: 4px; font-size: 0.85rem; }
    .cart-next-reqs .met { color: #88cc66; }
    .cart-next-reqs .unmet { color: #cc6644; }
    .cart-upgrade-btn { display: block; width: 100%; margin-top: 8px; padding: 8px; background: linear-gradient(180deg, #8b5e2a, #6b3a1f); border: 2px solid #d4a44c; border-radius: 6px; color: #f0e6d0; font-family: 'MedievalSharp', cursive; font-size: 1.1rem; cursor: pointer; }
    .cart-upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; font-size: 0.8rem; font-family: inherit; }
    .cart-max-level { color: #d4a44c; text-align: center; margin-top: 8px; }
    .equipment-section-label { color: #8a7a60; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0; }
    .equipment-list { display: flex; flex-direction: column; gap: 6px; }
    .equipment-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(50,38,20,0.6); border: 1px solid #3a2a18; border-radius: 6px; }
    .equipment-item.owned { border-color: #4a6a3a; opacity: 0.7; }
    .equipment-name { color: #d8c8a8; font-size: 0.9rem; }
    .equipment-desc { color: #7a6b52; font-size: 0.75rem; display: block; }
    .equipment-owned-label { color: #88cc66; font-size: 0.8rem; }
    .equipment-buy-btn { background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; border-radius: 4px; color: #f0d060; padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .equipment-buy-btn:hover { background: rgba(70,100,50,0.6); }
    .equipment-buy-btn.disabled { opacity: 0.4; cursor: not-allowed; }

    /* ═══ ENCYCLOPEDIA OVERLAY ═══ */
    #encyclopedia-overlay {
      position: fixed; inset: 0; z-index: 90; display: none;
      background: rgba(10,8,4,0.85);
      align-items: center; justify-content: center;
    }
    .encyclopedia-card {
      background: rgba(35,28,15,0.98); border: 3px solid #6b4c2a; border-radius: 12px;
      padding: 24px 30px; width: 450px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .encyclopedia-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .encyclopedia-emoji { font-size: 2.5rem; }
    .encyclopedia-name { font-family: 'MedievalSharp', cursive; color: #d4a44c; font-size: 1.4rem; }
    .encyclopedia-tier { font-size: 0.85rem; }
    .encyclopedia-lore { font-style: italic; color: #a8987a; font-size: 0.95rem; margin-bottom: 12px; padding: 8px; background: rgba(50,38,20,0.5); border-radius: 6px; }
    .encyclopedia-section { margin-bottom: 10px; }
    .encyclopedia-section h4 { color: #c8b896; font-size: 0.9rem; margin-bottom: 4px; }
    .encyclopedia-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .encyclopedia-tag { background: rgba(80,60,30,0.5); border: 1px solid #4a3520; border-radius: 12px; padding: 2px 10px; color: #c8b896; font-size: 0.8rem; }
    .encyclopedia-origin { color: #a8987a; font-size: 0.9rem; }
    .encyclopedia-recipe-item { color: #d8c8a8; font-size: 0.85rem; padding: 2px 0; }
    .encyclopedia-recipe-unknown { color: #6a5a40; font-style: italic; font-size: 0.85rem; }
    .encyclopedia-close { display: block; margin: 12px auto 0; padding: 8px 24px; background: rgba(60,45,25,0.8); border: 1px solid #6b4c2a; border-radius: 6px; color: #d8c8a8; cursor: pointer; font-family: inherit; font-size: 1rem; }

    /* ═══ BACK TO CART BUTTON ═══ */
    #back-to-cart-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50;
      display: none; padding: 10px 30px;
      background: linear-gradient(180deg, #8b5e2a, #6b3a1f);
      border: 2px solid #d4a44c; border-radius: 8px;
      color: #f0e6d0; font-family: 'MedievalSharp', cursive; font-size: 1.2rem;
      cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    #back-to-cart-btn:hover { background: linear-gradient(180deg, #a0702f, #804520); }

    /* HUD button notification */
    .hud-btn.has-notification { border-color: #d4a44c; color: #f0d060; animation: hudPulse 1s ease-in-out infinite; }
    @keyframes hudPulse { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 8px rgba(212,164,76,0.5); } }

    /* Origin badge */
    #origin-badge { font-size: 0.85rem; color: #a08c6a; display: none; }
    #level-display { font-size: 0.85rem; color: #a08c6a; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(30,22,12,0.5); }
    ::-webkit-scrollbar-thumb { background: #4a3520; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b4c2a; }

    /* Tooltip */
    #tooltip {
      position: fixed; z-index: 95; display: none;
      background: rgba(20,15,8,0.95); border: 1px solid #6b4c2a; border-radius: 4px;
      padding: 6px 10px; color: #d8c8a8; font-size: 0.8rem; max-width: 200px;
      pointer-events: none;
    }

    /* ═══ MULTIPLAYER HUD ═══ */
    .mp-btn { font-size: 0.8rem !important; padding: 3px 8px !important; }

    /* ═══ OVERLAY PANELS (marketplace, trade, export, leaderboard, commission) ═══ */
    .overlay-panel {
      position: fixed; z-index: 80;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 520px; max-height: 80vh; overflow-y: auto;
      background: rgba(30,22,12,0.97); border: 3px solid #6b4c2a;
      border-radius: 12px; padding: 0;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px 10px; border-bottom: 1px solid #3a2a18;
    }
    .panel-header h2 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin: 0; font-size: 1.3rem; }
    .close-btn {
      background: none; border: 1px solid #4a3520; border-radius: 4px;
      color: #8a7a60; padding: 2px 8px; cursor: pointer; font-size: 1rem;
    }
    .close-btn:hover { color: #d4a44c; border-color: #d4a44c; }
    .panel-tabs {
      display: flex; gap: 0; border-bottom: 1px solid #3a2a18;
    }
    .tab-btn {
      flex: 1; padding: 8px; background: none; border: none; border-bottom: 2px solid transparent;
      color: #8a7a60; cursor: pointer; font-family: inherit; font-size: 0.85rem; text-align: center;
    }
    .tab-btn:hover { color: #c8b896; }
    .tab-btn.active { color: #d4a44c; border-bottom-color: #d4a44c; }
    .panel-content { padding: 14px 20px 20px; }
    .loading { color: #8a7a60; text-align: center; padding: 20px; font-style: italic; }
    .empty-state { color: #6a5a40; text-align: center; padding: 20px; font-style: italic; }
    .action-btn {
      display: block; width: 100%; margin-top: 12px; padding: 10px;
      background: linear-gradient(180deg, #8b5e2a, #6b3a1f);
      border: 2px solid #d4a44c; border-radius: 6px;
      color: #f0e6d0; font-family: 'MedievalSharp', cursive; font-size: 1.1rem;
      cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .action-btn:hover { background: linear-gradient(180deg, #a0702f, #804520); }
    .small-btn {
      background: rgba(60,45,25,0.6); border: 1px solid #4a3520; border-radius: 4px;
      color: #c8b896; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
    }
    .small-btn:hover { border-color: #d4a44c; }

    /* Marketplace items */
    .marketplace-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; background: rgba(50,38,20,0.6); border: 1px solid #3a2a18;
      border-radius: 6px; margin-bottom: 6px;
    }
    .item-info { display: flex; align-items: center; gap: 8px; }
    .item-type { font-size: 1.1rem; }
    .item-qty { color: #8a7a60; font-size: 0.85rem; }
    .item-meta { display: flex; align-items: center; gap: 8px; }
    .seller { color: #8a7a60; font-size: 0.8rem; }
    .price { color: #f0d060; font-weight: 600; }
    .buy-btn, .cancel-btn {
      background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; border-radius: 4px;
      color: #a8d888; padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
    }
    .buy-btn:hover { background: rgba(70,100,50,0.6); }
    .cancel-btn { background: rgba(80,40,40,0.6); border-color: #6a3a3a; color: #d88888; }
    .cancel-btn:hover { background: rgba(100,50,50,0.6); }

    /* Sell form */
    .sell-form h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin: 10px 0 6px; font-size: 1rem; }
    .sell-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 0;
      font-size: 0.85rem; border-bottom: 1px solid rgba(58,42,24,0.4);
    }
    .sell-item input {
      background: rgba(44,32,18,0.8); border: 1px solid #4a3520; border-radius: 4px;
      color: #f0e6d0; font-family: inherit; padding: 3px 6px; font-size: 0.85rem;
    }
    .list-btn, .list-drink-btn {
      background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; border-radius: 4px;
      color: #a8d888; padding: 3px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
    }

    /* Trade items */
    .trade-item {
      padding: 10px; background: rgba(50,38,20,0.6); border: 1px solid #3a2a18;
      border-radius: 6px; margin-bottom: 8px;
    }
    .trade-header { margin-bottom: 6px; }
    .trader { color: #c8b896; font-size: 0.9rem; }
    .trade-details { display: flex; align-items: center; gap: 8px; }
    .trade-offer, .trade-want { flex: 1; font-size: 0.85rem; color: #d8c8a8; }
    .trade-arrow { color: #d4a44c; font-size: 1.2rem; }
    .accept-trade-btn, .cancel-trade-btn {
      margin-top: 6px; padding: 4px 12px; border-radius: 4px;
      cursor: pointer; font-family: inherit; font-size: 0.8rem;
    }
    .accept-trade-btn { background: rgba(60,80,40,0.6); border: 1px solid #4a6a3a; color: #a8d888; }
    .cancel-trade-btn { background: rgba(80,40,40,0.6); border: 1px solid #6a3a3a; color: #d88888; }
    .trade-form h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin: 10px 0 6px; font-size: 1rem; }
    .trade-form select {
      background: rgba(44,32,18,0.8); border: 1px solid #4a3520; border-radius: 4px;
      color: #f0e6d0; font-family: inherit; padding: 4px 8px; font-size: 0.85rem; margin-right: 4px;
    }
    .trade-slots { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .trade-slot {
      background: rgba(60,45,25,0.6); border: 1px solid #4a3520; border-radius: 4px;
      padding: 3px 8px; font-size: 0.8rem; color: #d8c8a8;
    }
    .trade-slot .remove-slot {
      background: none; border: none; color: #cc6644; cursor: pointer; margin-left: 4px; font-size: 0.85rem;
    }

    /* Export items */
    .export-form .export-section { margin-bottom: 12px; }
    .export-form h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; font-size: 1rem; margin-bottom: 6px; }
    .export-form select {
      width: 100%; background: rgba(44,32,18,0.8); border: 1px solid #4a3520; border-radius: 4px;
      color: #f0e6d0; font-family: inherit; padding: 6px 10px; font-size: 0.9rem;
    }
    .export-regions { display: flex; flex-wrap: wrap; gap: 4px; }
    .region-btn {
      background: rgba(50,38,20,0.6); border: 1px solid #3a2a18; border-radius: 6px;
      color: #c8b896; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
    }
    .region-btn:hover { border-color: #8a7040; }
    .region-btn.selected { border-color: #d4a44c; background: rgba(100,80,40,0.4); color: #f0e6d0; }
    .export-preview { margin-top: 12px; padding: 10px; background: rgba(50,38,20,0.4); border: 1px solid #3a2a18; border-radius: 6px; }
    .preview-row { margin-bottom: 4px; font-size: 0.9rem; }
    .preview-row.info { color: #8a7a60; font-size: 0.8rem; }
    .export-legend { margin-top: 12px; font-size: 0.8rem; color: #6a5a40; }
    .export-legend p { margin-bottom: 2px; }
    .export-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px; background: rgba(50,38,20,0.4); border: 1px solid #3a2a18;
      border-radius: 6px; margin-bottom: 4px; font-size: 0.85rem;
    }
    .export-item.pending { border-left: 3px solid #d4a44c; }
    .export-item.resolved { border-left: 3px solid #88cc66; opacity: 0.8; }
    .export-price { color: #f0d060; font-weight: 600; }
    .export-timer { color: #d4a44c; }
    .export-risk { color: #cc6644; }

    /* Leaderboard */
    .season-info { padding: 10px; background: rgba(50,38,20,0.4); border-radius: 6px; margin-bottom: 12px; }
    .season-id { font-family: 'MedievalSharp', cursive; color: #d4a44c; font-size: 1rem; }
    .season-modifier { display: block; color: #88cc66; font-size: 0.85rem; margin-top: 2px; }
    .season-note { display: block; color: #6a5a40; font-size: 0.8rem; margin-top: 2px; }
    .leaderboard-list { display: flex; flex-direction: column; gap: 4px; }
    .leaderboard-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      background: rgba(50,38,20,0.4); border: 1px solid #3a2a18; border-radius: 4px;
      font-size: 0.85rem;
    }
    .leaderboard-row.is-me { border-color: #d4a44c; background: rgba(100,80,40,0.3); }
    .leaderboard-row.top-3 { border-color: #8a7040; }
    .lb-rank { width: 36px; text-align: center; font-size: 1rem; }
    .lb-name { flex: 1; color: #d8c8a8; }
    .lb-cart { color: #8a7a60; font-style: italic; font-size: 0.8rem; }
    .lb-level { color: #a08c6a; font-size: 0.8rem; }
    .lb-recipes { color: #88cc66; font-size: 0.8rem; }
    .lb-score { color: #f0d060; font-weight: 600; }

    /* Commission */
    .commission-detail { }
    .commission-name { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .commission-name h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin: 0; font-size: 1.1rem; }
    .commission-timer { color: #cc8844; font-size: 0.85rem; }
    .commission-desc { color: #a8987a; font-style: italic; margin-bottom: 10px; }
    .commission-progress { margin-bottom: 10px; }
    .progress-bar { height: 10px; background: #2a2a1a; border-radius: 5px; overflow: hidden; margin-bottom: 4px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6b4c2a, #d4a44c); transition: width 0.5s; }
    .progress-text { color: #c8b896; font-size: 0.85rem; }
    .commission-reward { display: flex; justify-content: space-between; align-items: center; color: #f0d060; margin-bottom: 10px; }
    .completed-badge { color: #88cc66; font-weight: 600; }
    .commission-submit h4 { color: #c8b896; margin-bottom: 6px; }
    .submit-drinks { display: flex; flex-direction: column; gap: 4px; }
    .submit-drink-option { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #d8c8a8; cursor: pointer; }
    .submit-drink-option input { accent-color: #d4a44c; }
    .info-text { color: #8a7a60; font-style: italic; font-size: 0.9rem; }

    /* Commission alert (popup) */
    .commission-alert {
      position: fixed; inset: 0; z-index: 85;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,8,4,0.6);
      animation: alertFadeIn 0.3s ease-out;
    }
    .commission-alert-content {
      background: rgba(40,30,15,0.98); border: 3px solid #d4a44c; border-radius: 12px;
      padding: 24px 30px; text-align: center; max-width: 400px;
      box-shadow: 0 0 40px rgba(212,164,76,0.4);
    }
    .commission-trumpet { font-size: 2rem; margin-bottom: 8px; }
    .commission-alert-content h3 { font-family: 'MedievalSharp', cursive; color: #d4a44c; margin-bottom: 8px; }
    .commission-alert-content p { color: #a8987a; font-style: italic; margin-bottom: 8px; }
    .commission-reward { color: #f0d060; font-size: 1.1rem; margin-bottom: 12px; }
    .commission-dismiss {
      padding: 8px 24px; background: rgba(60,45,25,0.8); border: 1px solid #6b4c2a;
      border-radius: 6px; color: #d8c8a8; cursor: pointer; font-family: inherit;
    }
    @keyframes alertFadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ═══ TOWN CRIER BANNER ═══ */
    .crier-banner {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 55;
      height: 32px; display: flex; align-items: center;
      background: linear-gradient(180deg, rgba(30,22,12,0) 0%, rgba(30,22,12,0.9) 30%);
      overflow: hidden;
    }
    .crier-icon { padding: 0 8px; font-size: 1rem; }
    .crier-scroll { flex: 1; overflow: hidden; white-space: nowrap; }
    .crier-text {
      display: inline-block; color: #c8a870; font-size: 0.8rem; font-style: italic;
      animation: crier-scroll 30s linear infinite;
    }
    @keyframes crier-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- INTRO -->
  <div id="intro-overlay">
    <h1>🍺 Brewmaster's Bazaar</h1>
    <p class="subtitle">Discover recipes. Brew legends. Outsell the realm.</p>
    <div id="intro-name">
      <p class="prompt">What's your name, brewer?</p>
      <input id="name-input" type="text" placeholder="Enter your name..." maxlength="20" autofocus>
      <p class="hint">Press Enter</p>
    </div>
    <div id="intro-cart" style="display:none">
      <p class="prompt">And what shall we call your cart?</p>
      <input id="cart-input" type="text" placeholder="Name your cart..." maxlength="25">
      <p class="hint">Press Enter</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-inner">
      <div class="hud-section">
        <span id="cart-name-display"></span>
      </div>
      <div class="hud-section">
        <span id="crown-display">👑 50</span>
        <span id="reputation-display">⭐ 0</span>
        <span id="streak-display">🔥 Hot Streak!</span>
      </div>
      <div class="hud-section">
        <span id="origin-badge"></span>
        <span id="level-display"></span>
        <button class="hud-btn" id="journal-btn">📖 Journal</button>
        <button class="hud-btn" id="garden-btn">🌿 Forage</button>
        <button class="hud-btn" id="merchant-btn">🧔 Omar</button>
        <button class="hud-btn" id="barrel-btn">🪵 Barrels</button>
        <button class="hud-btn" id="equipment-btn">⚒️ Upgrade</button>
      </div>
    </div>
    <div id="hud-multiplayer" style="display:flex;align-items:center;gap:6px;justify-content:center;padding:4px 20px;">
      <button class="hud-btn mp-btn" id="marketplace-btn">🏪 Market</button>
      <button class="hud-btn mp-btn" id="trade-btn">🔄 Trade</button>
      <button class="hud-btn mp-btn" id="export-btn">🚢 Export</button>
      <button class="hud-btn mp-btn" id="commission-btn">👑 Commission</button>
      <button class="hud-btn mp-btn" id="leaderboard-btn">🏆 Leaderboard</button>
    </div>
  </div>

  <!-- SHELF -->
  <div id="shelf-panel" class="panel"></div>

  <!-- CAULDRON -->
  <div id="cauldron-panel" class="panel"></div>

  <!-- CUSTOMERS -->
  <div id="customer-panel" class="panel"></div>

  <!-- RESULT -->
  <div id="result-overlay">
    <div id="result-card">
      <h2 id="result-name"></h2>
      <div id="result-stars" class="stars"></div>
      <div id="result-discovery" class="discovery"></div>
      <div id="result-lore" class="lore"></div>
      <div id="result-nearmiss" class="near-miss"></div>
      <button id="result-dismiss">Continue</button>
    </div>
  </div>

  <!-- JOURNAL -->
  <div id="journal-overlay">
    <div id="journal-book">
      <h2>📖 Recipe Journal</h2>
      <div id="journal-recipes"></div>
      <button id="journal-close">Close</button>
    </div>
  </div>

  <!-- BREWING ANIMATION -->
  <div id="brewing-overlay">
    <div id="brewing-text">Brewing...</div>
  </div>

  <!-- NOTIFICATIONS -->
  <div id="notifications"></div>

  <!-- MERCHANT PANEL -->
  <div id="merchant-panel"></div>

  <!-- GARDEN PANEL -->
  <div id="garden-panel" class="panel"></div>

  <!-- BARREL PANEL -->
  <div id="barrel-panel"></div>

  <!-- EQUIPMENT PANEL -->
  <div id="equipment-panel"></div>

  <!-- ENCYCLOPEDIA -->
  <div id="encyclopedia-overlay">
    <div class="encyclopedia-card"></div>
  </div>

  <!-- BACK TO CART (foraging view) -->
  <button id="back-to-cart-btn">🍺 Back to Cart</button>

  <!-- TOOLTIP -->
  <div id="tooltip"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
